name: Tests

# astra-shared had no test run in CI: astra-radio-engine and astra-ui-app
# install it from main, but nothing ran its own tests. This runs them on every
# push and on pull requests to main and develop, matching those repos.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # Only the package's declared requirements. rasterio is deliberately
      # absent: the WorldCover lookup tests replace the raster reader, so they
      # must pass without it, and this is where that is checked.
      - name: Install dependencies
        run: pip install -r requirements.txt pytest ruff

      - name: Ruff duplicate and undefined names gate
        run: python -m ruff check --select F811,F821 .

      - name: Run unit tests
        run: python -m pytest tests/ -v

      # A0 plan v7, section 8.1 and G06: the installed wheel, not the checkout,
      # provides astra_shared, and it carries the A0 WGS84 API.
      - name: Clean wheel install and import
        run: |
          python -m pip wheel . --no-deps -w dist
          python -m venv /tmp/wheel-env
          /tmp/wheel-env/bin/pip install dist/*.whl
          cd /tmp
          /tmp/wheel-env/bin/python -c "import astra_shared, astra_shared.geo_math as g; assert astra_shared.__file__.startswith('/tmp/wheel-env/'), astra_shared.__file__; g.intersect_ray_wgs84_vec([[8e7, 0, 0]], [[-1, 0, 0]]); print('wheel import OK:', astra_shared.__file__)"
